plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("android-keys/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "ng.ccc.hq"
    compileSdk 34

    defaultConfig {
        applicationId "ng.ccc.hq"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "appName", "CCC HQ"
        resValue "string", "launcherName", "CCC HQ"
        resValue "string", "hostName", "ccc-three-kappa.vercel.app"
        resValue "string", "defaultUrl", "https://ccc-three-kappa.vercel.app/dashboard"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            // Debug builds still use the same host; assetlinks match the release cert for production installs.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
